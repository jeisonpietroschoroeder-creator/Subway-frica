name: APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Preparar projeto
        run: |
          mkdir www && cp corre-zeca-3d.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 three@0.128.0
          cp node_modules/three/build/three.min.js www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
          echo '{"appId":"com.zeca.corre","appName":"Corre, Zeca!","webDir":"www"}' > capacitor.config.json
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: corre-zeca-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
