<html lang="pt-BR"><head><meta charset="utf-8">

<title>Corre, Zeca! — Corrida pelo Rio</title>
<style>

.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#fff;background:rgba(20,10,40,.6);padding:24px}

</style></head><body>
<canvas id="c"></canvas>
<div id="menu" class="ov"><h1>Corre, Zeca!</h1><p>Corra pelos trilhos do metrô do Rio, fuja do fiscal e do cachorro, pegue moedinhas e bata seu recorde de tempo!</p><div class="how">← → trocar de pista<br>↑ pular · ↓ rolar<br>Suba nas rampas e corra em cima dos trens<br><small>Deslize na tela ou use as setas</small></div><button id="go">Jogar</button></div>
<div id="over" class="ov hidden"><h2>Tropeçou!</h2><p id="res"></p><button id="again">Jogar de novo</button></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d'),R=n=>Math.floor(Math.random()*n);
let W,H,LW,U,hy,gy;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);LW=Math.min(W*.3,H*.15);U=LW*.9;hy=H*.31;gy=H*.82}
addEventListener('resize',rs);
const S=z=>1/(1+z*.09),GY=s=>hy+(gy-hy)*s,X=(l,s)=>W/2+(l-camx)*LW*s;
let st='menu',camx=0,inv=0,pl=0,chase=0,tmr=0,dist=0,speed=20,coins=0,obs=[],cn=[],bld=[],px=0,lane=0,py=0,vy=0,roll=0,tm=0,spawn=20,bt=0,shake=0,best=0;
try{best=+localStorage.getItem('zeca_best2')||0}catch(e){}
const BC=['#e8573a','#f2b134','#3bb3a3','#4a7fd1','#d86aa8','#8fcf4a','#f4eee0'],city=Array.from({length:40},()=>.01+Math.random()*.035);
function addB(z){for(const s of[-1,1])bld.push({s,z,w:1.4+Math.random()*1.3,h:2.2+Math.random()*3.5,c:BC[R(7)],sd:R(9)})}
function reset(){camx=0;inv=0;pl=0;chase=0;tmr=0;dist=0;speed=20;coins=0;obs=[];cn=[];bld=[];lane=0;px=0;py=0;vy=0;roll=0;spawn=20;bt=0;shake=0;for(let z=-3;z<80;z+=7)addB(z)}
function coinLine(l,z,n,hs){for(let i=0;i<n;i++)cn.push({l,z:z+i*1.7,h:Array.isArray(hs)?hs[i]:hs})}
const fmt=t=>{const m=Math.floor(t/60),s=Math.floor(t%60),c=Math.floor(t*100%100);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0')};
function pattern(z){
 const r=Math.random(),f=R(3),T=()=>Math.random()<.5?'bonde':'bus',L=[-1,0,1];
 if(r<.2){obs.push({t:'flag',l:0,z});coinLine(R(3)-1,z+5,4,.6)}
 else if(r<.48){const o=L.filter((l,i)=>i!==f);if(Math.random()<.5)o.splice(R(2),1);o.forEach(l=>obs.push({t:T(),l,z}));coinLine(f-1,z-2,6,.6)}
 else if(r<.75){const n=1+R(3),o=L.slice().sort(()=>Math.random()-.5).slice(0,n);o.forEach(l=>obs.push({t:'low',l,z}));coinLine(o[0],z-3,5,[.7,1.3,1.7,1.3,.7])}
 else{const o=L.filter((l,i)=>i!==f);obs.push({t:T(),l:o[0],z});obs.push({t:'low',l:o[1],z});coinLine(f-1,z-2,6,.6)}
}
const DP={bonde:4.5,bus:5.5},HT={bonde:1.7,bus:1.5};
function tr(l,z,t,v){obs.push({t,l,z,d:DP[t],ht:HT[t],v:v||0})}
function surf(x){let h=0;for(const o of obs){if(Math.abs(x-o.l)>.45||o.z>0||o.z+(o.d||0)<0)continue;if(o.t==='ramp')h=Math.max(h,o.ht*(-o.z/o.d));else if(o.ht)h=Math.max(h,o.ht)}return h}
function pattern2(z){
 const r=Math.random(),T=()=>Math.random()<.5?'bonde':'bus',f=R(3),fl=f-1,o=[-1,0,1].filter((l,i)=>i!==f);
 if(r<.14){obs.push({t:'flag',l:0,z});coinLine(fl,z+5,4,.6)}
 else if(r<.42){const l=R(3)-1,t=T(),ht=HT[t];obs.push({t:'ramp',l,z,d:5,ht});tr(l,z+5,t);if(Math.random()<.5)tr(l,z+5+DP[t],t);coinLine(l,z+6,5,ht+.6);[-1,0,1].filter(x=>x!==l).forEach(x=>{if(Math.random()<.6)obs.push({t:'low',l:x,z:z+R(8)})})}
 else if(r<.52){o.forEach((l,i)=>tr(l,z,T(),i?0:8));coinLine(fl,z-2,6,.6)}
 else if(r<.8){tr(o[0],z,T());obs.push({t:'low',l:o[1],z});coinLine(fl,z-2,6,.6)}
 else{const n=1+R(3),q=[-1,0,1].sort(()=>Math.random()-.5).slice(0,n);q.forEach(l=>obs.push({t:'low',l,z}));coinLine(q[0],z-3,5,[.7,1.3,1.7,1.3,.7])}
}
function crash(o){if(!chase){chase=6;shake=.3;inv=.6;if(o)o.z=-99;return}st='over';shake=.35;if(tmr>best){best=tmr;try{localStorage.setItem('zeca_best2',best)}catch(e){}}
 setTimeout(()=>{$('res').innerHTML='Você correu <b>'+Math.floor(dist)+' m</b> em <b>'+fmt(tmr)+'</b> e pegou <b>'+coins+'</b> moedinhas.<br>Recorde: <b>'+fmt(best)+'</b>';$('over').classList.remove('hidden')},600)}
function moveB(dz){bt-=dz;if(bt<=0){addB(78);bt=7}bld.forEach(b=>b.z-=dz);bld=bld.filter(b=>b.z>-4)}
function upd(dt){
 tm+=dt;tmr+=dt;if(chase>0)chase-=dt;speed=Math.min(50,22+dist/45);const dz=speed*dt;dist+=dz;px+=(lane-px)*Math.min(1,dt*14);camx+=(px*.55-camx)*Math.min(1,dt*6);
 {const sh=surf(px);if(inv>0)inv-=dt;
 if(inv<=0&&sh-py>.45&&vy<=0){lane=px=pl;crash(null)}
 else if(py>sh+.001||vy>0){py+=vy*dt;vy-=30*dt;const s2=surf(px);if(py<=s2&&vy<=0){py=s2;vy=0}}
 else py=sh}
 if(roll>0)roll-=dt;

 for(const o of obs){o.z-=dz+(o.v||0)*dt;if(st!=='play')break;
  if(inv<=0&&o.t!=='ramp'&&o.z<.5&&o.z+dz+(o.v||0)*dt>-.6&&(o.t==='flag'||Math.abs(px-o.l)<.6)){if(o.t==='low'){if(py<.65)crash(o)}else if(o.t==='flag'){if(roll<=0&&py<1.5)crash(o)}else if(py<o.ht-.3)crash(o)}}
 for(const c of cn){c.z-=dz;if(!c.got&&Math.abs(c.z)<.8&&Math.abs(px-c.l)<.6){const top=py+(roll>0?.6:1.3);if(c.h>=py-.2&&c.h<=top+.2){c.got=1;coins++}}}

}
function idle(dt){tm+=dt;if(st==='menu'){dist+=dt*10;moveB(dt*10)}else shake=Math.max(0,shake-dt)}
function start(){reset();st='play';$('menu').classList.add('hidden');$('over').classList.add('hidden')}
const left=()=>{if(st==='play'){pl=lane;lane=Math.max(-1,lane-1)}},right=()=>{if(st==='play'){pl=lane;lane=Math.min(1,lane+1)}},jump=()=>{if(st==='play'&&vy===0&&py<=surf(px)+.02)vy=9.5},down=()=>{if(st==='play'){roll=.6;if(py>surf(px)+.05)vy=-20}};
$('go').onclick=start;$('again').onclick=start;
addEventListener('keydown',e=>{const k=e.key;if(st!=='play'){if(k==='Enter'||k===' ')start();return}
 if(k==='ArrowLeft'||k==='a')left();else if(k==='ArrowRight'||k==='d')right();else if(k==='ArrowUp'||k==='w'||k===' ')jump();else if(k==='ArrowDown'||k==='s')down()});
let sx=0,sy=0,sd=false;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sd=true});
cv.addEventListener('pointermove',e=>{if(!sd)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>26){if(Math.abs(dx)>Math.abs(dy))dx>0?right():left();else dy<0?jump():down();sd=false}});
addEventListener('pointerup',()=>sd=false);
/* ---------- desenho ---------- */
function sky(){
 let g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,'#2b1055');g.addColorStop(.55,'#d7566f');g.addColorStop(1,'#ffb36b');ctx.fillStyle=g;ctx.fillRect(0,0,W,hy+2);
 {const sx=W*.45,sy=hy-H*.06,gl=ctx.createRadialGradient(sx,sy,H*.03,sx,sy,H*.4);gl.addColorStop(0,'rgba(255,220,150,.9)');gl.addColorStop(1,'rgba(255,150,100,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,hy);ctx.fillStyle='#fff1c4';ctx.beginPath();ctx.arc(sx,sy,H*.05,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,200,190,.35)';for(let i=0;i<5;i++){const cx=((i*W*.27+tm*6)%(W+240))-120,cy=hy*(.2+.12*(i%3));ctx.beginPath();ctx.ellipse(cx,cy,70,11,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(cx+38,cy-7,42,9,0,0,7);ctx.fill()}}
 ctx.fillStyle='#5b2c6f';ctx.beginPath();ctx.moveTo(0,hy);ctx.lineTo(0,hy-H*.05);ctx.quadraticCurveTo(W*.15,hy-H*.12,W*.3,hy-H*.05);ctx.quadraticCurveTo(W*.5,hy-H*.1,W*.65,hy-H*.04);ctx.lineTo(W,hy-H*.06);ctx.lineTo(W,hy);ctx.fill();

 const cx=W*.78,cy=hy-H*.1,k=H*.0013;ctx.fillStyle='#ece7da';
 ctx.fillRect(cx-12*k,cy-12*k,24*k,12*k);ctx.fillRect(cx-6*k,cy-50*k,12*k,38*k);ctx.fillRect(cx-30*k,cy-48*k,60*k,6*k);ctx.beginPath();ctx.arc(cx,cy-55*k,5*k,0,7);ctx.fill();

}
function quad(a,b,z0,z1,c){const s0=S(z0),s1=S(z1);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(X(a,s0),GY(s0));ctx.lineTo(X(b,s0),GY(s0));ctx.lineTo(X(b,s1),GY(s1));ctx.lineTo(X(a,s1),GY(s1));ctx.fill()}
function road(){
 const off=dist%4,base=Math.floor(dist/4);
 for(let i=0;i<45;i++){const z0=i*4-off,z1=z0+4.05,n=(base+i)%2;
  quad(-1.5,1.5,z0,z1,n?'#6b6458':'#746c5f');quad(1.5,2.3,z0,z1,n?'#f1ede4':'#25232e');quad(-2.3,-1.5,z0,z1,n?'#f1ede4':'#25232e');
  for(const l of[-1,0,1]){quad(l-.42,l+.42,z0+1,z0+1.8,'#4e3a2a');quad(l-.3,l-.23,z0,z1,'#b9bcc4');quad(l+.23,l+.3,z0,z1,'#b9bcc4')}quad(-1.57,-1.5,z0,z1,'#9a97a3');quad(1.5,1.57,z0,z1,'#9a97a3')}
 const g=ctx.createLinearGradient(0,hy,0,hy+H*.12);g.addColorStop(0,'rgba(255,179,107,.9)');g.addColorStop(1,'rgba(255,179,107,0)');ctx.fillStyle=g;ctx.fillRect(0,hy,W,H*.12);
}
function drawB(b){
 const s=S(b.z),x=X(b.s*(2.3+b.w/2),s),w=b.w*LW*s,h=b.h*U*s,y=GY(s);

 {const s2=S(b.z+5),xi=X(b.s*2.3,s),x2=X(b.s*2.3,s2),y2=GY(s2),h2=b.h*U*s2;ctx.fillStyle=b.c;ctx.beginPath();ctx.moveTo(xi,y);ctx.lineTo(xi,y-h);ctx.lineTo(x2,y2-h2);ctx.lineTo(x2,y2);ctx.fill();ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill()}

 {const lx=X(b.s*1.9,s),ax=lx-b.s*.35*LW*s,ly=y-2.3*U*s;ctx.strokeStyle='#2a2a33';ctx.lineWidth=Math.max(1,4*s);ctx.beginPath();ctx.moveTo(lx,y);ctx.lineTo(lx,y-2.2*U*s);ctx.lineTo(ax,ly);ctx.stroke();ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(ax,ly,Math.max(1.5,5*s),0,7);ctx.fill()}ctx.fillStyle='#b5482f';ctx.fillRect(x-w/2-2*s,y-h-h*.05,w+4*s,h*.06);

 for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){ctx.fillStyle=(i*7+j*13+b.sd)%5<1?'#ffe08a':'#2b1b3d';const cw=w/cols;ctx.fillRect(x-w/2+j*cw+cw*.25,y-h+h*.1+i*(h*.8/rows),cw*.5,h*.8/rows*.5)}
 ctx.globalAlpha=1;
}
function blk(o,x,y,w,h,H0,d,c){const s2=S(o.z+d),x2=X(o.l,s2),y2=GY(s2),w2=.92*LW*s2,h2=H0*U*s2,g=Math.sign(o.l);
 ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x-w/2,y-h);ctx.lineTo(x+w/2,y-h);ctx.lineTo(x2+w2/2,y2-h2);ctx.lineTo(x2-w2/2,y2-h2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.25)';ctx.fill();
 if(g){const e=-g*.5;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x+e*w,y);ctx.lineTo(x+e*w,y-h);ctx.lineTo(x2+e*w2,y2-h2);ctx.lineTo(x2+e*w2,y2);ctx.fill();ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill()}}

  sq(0,1,0,o.ht,c);sq(0,1,0,o.ht,'rgba(0,0,0,.42)');sq(0,1,.3,.45,sc);sq(0,1,0,.22,'#26262e');
  for(let i=0;i<4;i++)sq((i+.12)/4,(i+.8)/4,.85,o.ht-.18,'#142033');

 const tp=t=>{const q=S(o.z+o.d*t);return[X(o.l,q),GY(q)-o.ht*U*q,.92*LW*q]},tq=(t0,t1,a,b,k)=>{const A=tp(t0),B=tp(t1);P(k,A[0]+a*A[2],A[1],A[0]+b*A[2],A[1],B[0]+b*B[2],B[1],B[0]+a*B[2],B[1])};
 tq(.18,.38,-.3,.3,'#9aa0aa');tq(.6,.8,-.3,.3,'#9aa0aa');tq(0,1,-.02,.02,'rgba(0,0,0,.25)');

function dObs(o){
 const s=S(o.z);if(s>1.6)return;const x=X(o.l,s),y=GY(s),w=.92*LW*s;ctx.globalAlpha=Math.max(0,Math.min(1,(82-o.z)/22));ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+w*.18,y+w*.03,w*.65,w*.1,0,0,7);ctx.fill();
 if(o.t==='ramp'){const s2=S(o.z+o.d),x2=X(o.l,s2),y2=GY(s2),w2=.92*LW*s2,h2=o.ht*U*s2,g=Math.sign(o.l);
  if(g){const e=-g*.5;ctx.fillStyle='#55525c';ctx.beginPath();ctx.moveTo(x+e*w,y);ctx.lineTo(x2+e*w2,y2);ctx.lineTo(x2+e*w2,y2-h2);ctx.fill();ctx.fillStyle='rgba(0,0,0,.35)';ctx.fill()}
