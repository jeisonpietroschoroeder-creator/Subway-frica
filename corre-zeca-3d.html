 if(tmr>best)best=tmr;tops.push({n:nick,t:tmr});tops.sort((a,b)=>b.t-a.t);tops=tops.slice(0,5);rank=tops.findIndex(e=>e.t===tmr);
 try{localStorage.setItem('zeca_tops2',JSON.stringify(tops));localStorage.setItem('zeca_best2',best)}catch(e){}
 setTimeout(()=>{$('res').innerHTML=(rank===0?'<div class="nr">\ud83c\udfc6 NOVO RECORDE!</div>':'')+esc(nick)+', voc\u00ea correu <b>'+Math.floor(dist)+' m</b> em <b>'+fmt(tmr)+'</b> e pegou <b>'+coins+'</b> moedinhas.<div class="rec" style="margin-top:10px"><h3>Recordes de tempo</h3>'+topsHTML(rank)+'</div>';$('over').classList.remove('hidden')},600)}
function moveW(dz){for(const s of['-1','1'])farZ[s]-=dz;for(const b of bl){b.z-=dz;if(b.z+b.dp/2<-12)bset(b)}for(const l of lamps){l.z-=dz;if(l.z<-12)l.z+=126}}
function upd(dt){
 tm+=dt;tmr+=dt;if(chase>0)chase-=dt;if(jb>0)jb-=dt;if(shake>0)shake=Math.max(0,shake-dt);
 speed=Math.min(50,22+dist/45);const dz=speed*dt;dist+=dz;
 px+=(lane-px)*Math.min(1,dt*14);camx+=(px*.55-camx)*Math.min(1,dt*6);
 {const sh=surf(px);if(inv>0)inv-=dt;
  if(inv<=0&&sh-py>.45&&vy<=0){lane=px=pl;crash(null)}
  else if(py>sh+.001||vy>0){py+=vy*dt;vy-=(vy>0?30:44)*dt;const s2=surf(px);if(py<=s2&&vy<=0){if(vy<-14)shake=.12;py=s2;vy=0;gt=0;if(jb>0){jb=0;vy=9.5}}else gt+=dt}
  else{py+=(sh-py)*Math.min(1,dt*22);if(Math.abs(sh-py)<.01)py=sh;gt=0;if(jb>0){jb=0;vy=9.5}}}
 if(roll>0)roll-=dt;
 spawn-=dz;if(spawn<=0){pattern(108);spawn=14+Math.random()*10+speed*.15}
 moveW(dz);
 for(const o of obs){o.z-=dz+(o.v||0)*dt;if(st!=='play')break;
  if(inv<=0&&o.t!=='ramp'&&o.z<.5&&o.z+dz+(o.v||0)*dt>-.6&&(o.t==='flag'||Math.abs(px-o.l)<.6)){if(o.t==='low'){if(py<.65)crash(o)}else if(o.t==='flag'){if(roll<=0&&py<1.5)crash(o)}else if(py<o.ht-.45)crash(o)}}
 for(const c of cn){c.z-=dz;if(!c.got&&Math.abs(c.z)<.8&&Math.abs(px-c.l)<.6){const top=py+(roll>0?.6:1.3);if(c.h>=py-.2&&c.h<=top+.2){c.got=1;coins++}}}
 obs=obs.filter(o=>{if(o.z>-3)return true;kill(o.m);return false});cn=cn.filter(c=>{if(c.z>-3&&!c.got)return true;scene.remove(c.m);return false})
}
function idle(dt){tm+=dt;if(st==='menu'){dist+=dt*10;moveW(dt*10)}else shake=Math.max(0,shake-dt)}
function start(){const v=$('nick').value.trim().replace(/[<>&"]/g,'').slice(0,12);nick=v||'Jogador';try{localStorage.setItem('zeca_nick',nick)}catch(e){}reset();st='play';$('menu').classList.add('hidden');$('over').classList.add('hidden');$('hud').classList.remove('hidden')}
const left=()=>{if(st==='play'){pl=lane;lane=Math.max(-1,lane-1)}},right=()=>{if(st==='play'){pl=lane;lane=Math.min(1,lane+1)}},
 jump=()=>{if(st==='play'){if(vy<=0&&(py<=surf(px)+.02||gt<.1)){vy=9.5;gt=1}else jb=.12}},down=()=>{if(st==='play'){roll=.6;if(py>surf(px)+.05)vy=-20}};
$('go').onclick=start;$('again').onclick=start;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Enter')start();return}const k=e.key;if(st!=='play'){if(k==='Enter'||k===' ')start();return}
 if(k==='ArrowLeft'||k==='a')left();else if(k==='ArrowRight'||k==='d')right();else if(k==='ArrowUp'||k==='w'||k===' ')jump();else if(k==='ArrowDown'||k==='s')down()});
let sx=0,sy=0,sd=false;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sd=true});
cv.addEventListener('pointermove',e=>{if(!sd)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>26){if(Math.abs(dx)>Math.abs(dy))dx>0?right():left();else dy<0?jump():down();sd=false}});
addEventListener('pointerup',()=>sd=false);
/* ---------- render ---------- */
function pose(c,a,air,rl){const u=c.userData;u.legs[0].rotation.x=air?-.5:a*.9;u.legs[1].rotation.x=air?.3:-a*.9;u.arms[0].rotation.x=air?-2.4:-a*.9;u.arms[1].rotation.x=air?-2.4:a*.9;if(rl){u.legs[0].rotation.x=u.legs[1].rotation.x=-1.3;u.arms[0].rotation.x=u.arms[1].rotation.x=-1.2}}
function render(dt){
 const a=Math.sin(tm*14),air=py>surf(px)+.05,rl=roll>0&&st==='play';
 P.position.set(px*LW,py+(rl?.4:.67),0);P.scale.setScalar(rl?.6:.95);if(rl)P.rotation.x-=dt*18;else P.rotation.x=0;P.rotation.z=(lane-px)*.2;pose(P,a,air,rl);
 const cv2=chase>0&&st!=='menu';G.visible=DOG.visible=cv2;if(cv2){G.position.set(px*LW,.73,3.4);DOG.position.set(px*LW+1,0,3.1+Math.sin(tm*15)*.05);pose(G,-a,false,false)}
 for(const o of obs)pos(o);
 for(const c of cn){c.m.position.set(c.l*LW,c.h,-c.z);c.m.rotation.y=tm*5}
 for(const b of bl)b.m.position.z=-b.z;for(const l of lamps)l.g.position.z=-l.z;
 const off=dist%2.4;let k=0;for(let i=0;i<72;i++)for(const l of[-1,0,1]){d3.position.set(l*LW,.06,-(i*2.4-off));d3.updateMatrix();sl.setMatrixAt(k++,d3.matrix)}sl.instanceMatrix.needsUpdate=true;
 balT.offset.y=(dist/4)%1;swT.offset.y=(dist/4)%1;
 const n=Math.min(.45,tmr/160);sun.intensity=1.1*(1-n);hemi.intensity=.8*(1-n*.7);
 const sh=shake>0?shake:0;cam.fov+=((62+(speed-22)*.25)-cam.fov)*.05;cam.updateProjectionMatrix();
 cam.position.set(camx*LW+(Math.random()-.5)*sh*.8,4.7+py*.35+(Math.random()-.5)*sh*.8,7.4);cam.lookAt(px*LW*.35,1.5+py*.3,-14);cam.rotation.z=(px-lane)*.04;
 renderer.render(scene,cam);
 if(st!=='menu'){$('hd').textContent=Math.floor(dist)+' m';$('hb').textContent='Recorde '+fmt(best);$('hn').textContent=nick;$('ht').textContent='\u23f1 '+fmt(tmr);$('hc').textContent='\ud83e\ude99 '+coins;$('warn').textContent=chase>0&&st==='play'?'O fiscal est\u00e1 na sua cola!':''}
}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(st==='play')upd(dt);else idle(dt);render(dt);requestAnimationFrame(loop)}
loadTops();showTops();setTimeout(()=>$('splash').classList.add('out'),2200);rs();reset();moveW(0);requestAnimationFrame(loop);
</script></body></html>
